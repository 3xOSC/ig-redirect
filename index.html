<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Открыть приложение</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;
color:#1d1d1f;text-align:center;padding:24px;
font:17px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
-webkit-font-smoothing:antialiased}
/* Кнопка видима ПО УМОЛЧАНИЮ. Скрипт её только прячет в обычном браузере —
   если скрипт не выполнится, страница всё равно останется рабочей, а не белой. */
#fallback.hidden{display:none}
#debug{display:none}
#debug.show{display:block}
.name{font-size:22px;letter-spacing:-.02em}
.hint{margin-top:8px;color:#86868b;font-size:15px}
#tip{display:none;margin-top:20px;color:#86868b;font-size:13.5px;
line-height:1.4;max-width:300px;margin-left:auto;margin-right:auto}
#tip.show{display:block}
a{display:inline-block;margin-top:22px;padding:15px 32px;border-radius:980px;
background:#0071e3;color:#fff;text-decoration:none;font-size:17px;font-weight:500}
#debug{max-width:100%;text-align:left}
#debug-log{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
white-space:pre-wrap;word-break:break-all;background:#f5f5f7;
padding:16px;border-radius:12px;margin:0}
</style>
</head>
<body>

<div id="fallback">
  <div class="name">Colette</div>
  <div class="hint">Нажмите, чтобы открыть в App&nbsp;Store</div>
  <!-- href подставляется скриптом; здесь — рабочий адрес на случай, если он не выполнится -->
  <a id="fallback-link" href="https://app.appsflyer.com/id6457366208">Открыть</a>
  <div id="tip"></div>
</div>

<div id="debug"><pre id="debug-log"></pre></div>

<script>
// Куда ведём по умолчанию. Переопределяется query-параметрами:
//   ?ios=<url>&android=<url>   — платформенные цели
//   ?u=<url>                   — одна цель на всё
//   ?debug=1                   — ничего не открывать, показать вычисленный маршрут
// Хост цели обязан быть в allowlist внутри router.js.
// Любой параметр цели в query отменяет эти дефолты целиком.
//
// ⚠️ Цель задавать ЗДЕСЬ, а не через ?u=. Ссылка с параметрами, переданная
// в ?u= без URL-кодирования, теряет всё после первого & — второй и дальше
// параметры распарсятся как параметры ЭТОЙ страницы, а не цели.
//
// {{...}} — макросы Meta, подставляются на их стороне до клика.
var AF = "https://app.appsflyer.com/id6457366208" +
  "?pid=metaweb_int" +
  "&c={{campaign.name}}" +
  "&af_siteid={{placement}}" +
  "&af_ad={{ad.name}}" +
  "&af_adset={{adset.name}}" +
  "&af_c_id={{campaign.id}}" +
  "&af_adset_id={{adset.id}}" +
  "&af_ad_id={{ad.id}}" +
  "&af_click_lookback=7d" +
  "&af_ios_store_cpp=1131d9d4-ab41-446e-88cb-06bf9d656624";

window.LINK_DEFAULTS = {
  ios: AF,
  android: AF,
  deep: null   // кастомная схема приложения, если оно уже установлено
};
</script>
<script src="router.js"></script>
</body>
</html>
